version: 2
updates:
  # Workflow actions are pinned to commit SHAs, which dependabot updates in
  # place along with the trailing version comment.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: .github
    groups:
      actions:
        patterns:
          - "*"
  # Module dependencies, grouped so the golang.org/x repositories upgrade
  # together as they do upstream.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: all
    groups:
      golang-x:
        patterns:
          - golang.org/x/*
